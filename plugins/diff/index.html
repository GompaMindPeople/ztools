<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>文本对比</title>
<style>
  body { margin: 0; padding: 14px 18px; background: #1d1d27; color: #ececf4; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui; user-select: none; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  button { background: #2e2e44; color: #dfe3ff; border: none; border-radius: 8px; padding: 6px 14px; cursor: pointer; font: inherit; }
  button:hover { background: #3a3a58; }
  button.primary { background: #4a6dff; color: #fff; }
  .stat { font-size: 12px; color: #9a9ab0; margin-left: auto; }
  .stat .add { color: #7ee2a0; }
  .stat .del { color: #ff9a9a; }
  .stat .mod { color: #ffd24d; }
  .editors { flex: 1; display: flex; gap: 10px; min-height: 0; }
  .col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .col .h { font-size: 12px; color: #8f8fa3; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .col .h button { padding: 2px 10px; font-size: 11px; }
  textarea { flex: 1; width: 100%; box-sizing: border-box; background: #15151c; color: #d6d6e2; border: 1px solid #2c2c3a; border-radius: 10px; padding: 10px 12px; font: 13px/1.5 Consolas, "Courier New", monospace; resize: none; outline: none; white-space: pre; overflow: auto; }
  textarea:focus { border-color: #4a6dff; }
  #result { flex: 1; overflow: auto; background: #15151c; border: 1px solid #2c2c3a; border-radius: 10px; display: none; }
  .row { display: grid; grid-template-columns: 38px 1fr 38px 1fr; font: 13px/1.5 Consolas, "Courier New", monospace; }
  .ln { color: #5d5d75; text-align: right; padding: 0 8px; user-select: none; background: rgba(255,255,255,0.02); }
  .cell { padding: 0 8px; white-space: pre-wrap; word-break: break-all; color: #d6d6e2; }
  .row.eq .cell { }
  .row.del .ca { background: rgba(255, 90, 90, 0.14); color: #ffb3b3; }
  .row.del .cb { background: rgba(255,255,255,0.015); }
  .row.add .cb { background: rgba(90, 200, 130, 0.14); color: #a9f0c0; }
  .row.add .ca { background: rgba(255,255,255,0.015); }
  .row.mod .ca { background: rgba(255, 210, 77, 0.12); }
  .row.mod .cb { background: rgba(255, 210, 77, 0.12); }
  .row.mod .ca mark { background: rgba(255, 90, 90, 0.35); color: #ffd9d9; border-radius: 2px; }
  .row.mod .cb mark { background: rgba(90, 200, 130, 0.35); color: #d6ffe4; border-radius: 2px; }
  mark { padding: 0; }
</style>
</head>
<body>
  <div class="bar">
    <button class="primary" id="compare">开始对比</button>
    <button id="back" style="display:none">← 返回编辑</button>
    <button id="swap" id2="swap">⇄ 交换 A/B</button>
    <button id="copyDiff">复制差异结果</button>
    <span class="stat" id="stat"></span>
  </div>
  <div class="editors" id="editors">
    <div class="col">
      <div class="h">A(原) <button data-to="a">粘贴剪贴板</button></div>
      <textarea id="ta" spellcheck="false" placeholder="粘贴或输入原文本/代码…"></textarea>
    </div>
    <div class="col">
      <div class="h">B(新) <button data-to="b">粘贴剪贴板</button></div>
      <textarea id="tb" spellcheck="false" placeholder="粘贴或输入新文本/代码…"></textarea>
    </div>
  </div>
  <div id="result"></div>
<script src="../../core/diff.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  let rows = [];

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // 按差异 span 把一行切成普通文本 + <mark> 片段
  function renderSpans(text, spans) {
    if (!spans || !spans.length) return escapeHtml(text);
    let out = '', pos = 0;
    for (const [s, e] of spans) {
      out += escapeHtml(text.slice(pos, s)) + '<mark>' + escapeHtml(text.slice(s, e)) + '</mark>';
      pos = e;
    }
    return out + escapeHtml(text.slice(pos));
  }

  function compare() {
    rows = zdiff.diffLines($('#ta').value, $('#tb').value);
    const add = rows.filter((r) => r.t === '+').length;
    const del = rows.filter((r) => r.t === '-').length;
    const mod = rows.filter((r) => r.t === '~').length;
    const eq = rows.filter((r) => r.t === '=').length;
    const parts = [];
    if (add) parts.push(`<span class="add">+${add}</span>`);
    if (del) parts.push(`<span class="del">-${del}</span>`);
    if (mod) parts.push(`<span class="mod">~${mod}</span>`);
    parts.push(`${eq} 相同`);
    if (rows.truncated) parts.push('(超过 5000 行已截断)');
    $('#stat').innerHTML = parts.join(' ');

    const frag = document.createDocumentFragment();
    for (const r of rows) {
      const d = document.createElement('div');
      d.className = 'row ' + (r.t === '=' ? 'eq' : r.t === '-' ? 'del' : r.t === '+' ? 'add' : 'mod');
      const l1 = document.createElement('span'); l1.className = 'ln'; l1.textContent = r.li || '';
      const c1 = document.createElement('span'); c1.className = 'cell ca';
      c1.innerHTML = r.t === '+' ? '' : renderSpans(r.a, r.ha);
      const l2 = document.createElement('span'); l2.className = 'ln'; l2.textContent = r.rj || '';
      const c2 = document.createElement('span'); c2.className = 'cell cb';
      c2.innerHTML = r.t === '-' ? '' : renderSpans(r.b, r.hb);
      d.append(l1, c1, l2, c2);
      frag.appendChild(d);
    }
    const res = $('#result');
    res.innerHTML = '';
    res.appendChild(frag);
    res.style.display = 'block';
    $('#editors').style.display = 'none';
    $('#compare').style.display = 'none';
    $('#back').style.display = '';
  }

  $('#compare').addEventListener('click', compare);
  $('#back').addEventListener('click', () => {
    $('#result').style.display = 'none';
    $('#editors').style.display = 'flex';
    $('#compare').style.display = '';
    $('#back').style.display = 'none';
  });
  $('#swap').addEventListener('click', () => {
    const a = $('#ta').value;
    $('#ta').value = $('#tb').value;
    $('#tb').value = a;
  });
  $('#copyDiff').addEventListener('click', async () => {
    const t = zdiff.toUnifiedText(rows, 'A', 'B');
    if (!t || t === '--- A\n+++ B') { await ztools.api.notify('文本对比', '没有差异可复制'); return; }
    await ztools.api.copy(t);
    await ztools.api.notify('文本对比', '差异结果已复制');
  });
  document.querySelectorAll('.col .h button').forEach((b) => {
    b.addEventListener('click', async () => {
      const t = await ztools.api.readClipboardText();
      if (!t) return;
      if (b.dataset.to === 'a') $('#ta').value = t; else $('#tb').value = t;
    });
  });

  (async () => {
    await ztools.api.setSubInput('左侧 A 为原文本,右侧 B 为新文本');
    if (ztools.query.trim()) $('#ta').value = ztools.query.trim();
  })();
})();
</script>
</body>
</html>
