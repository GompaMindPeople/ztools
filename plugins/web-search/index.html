<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网页搜索</title>
<style>
  body { margin: 0; padding: 26px 28px; background: #1d1d27; color: #ececf4; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui; user-select: none; }
  .q { font-size: 22px; font-weight: 700; word-break: break-all; }
  .q.empty { color: #6d6d85; font-size: 16px; font-weight: 400; }
  .url { color: #8f8fa3; font-size: 12px; margin-top: 8px; word-break: break-all; }
  .engines { display: flex; gap: 10px; margin-top: 18px; }
  .eng { background: #15151c; border: 1px solid #2c2c3a; border-radius: 10px; color: #b9b9c9; padding: 7px 18px; cursor: pointer; font: inherit; }
  .eng.on { border-color: #5b8cff; color: #fff; background: rgba(91,140,255,.14); }
  .go { margin-top: 20px; background: #4a6dff; color: #fff; border: none; border-radius: 10px; padding: 9px 26px; font-size: 14px; cursor: pointer; }
  .go:hover { background: #5b8cff; }
  .tip { color: #6d6d85; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="q" id="q">输入搜索内容</div>
  <div class="url" id="url"></div>
  <div class="engines" id="engines"></div>
  <button class="go" id="go">在浏览器中打开 (Enter)</button>
  <div class="tip">搜索引擎选择会保存在本插件中</div>
<script>
(() => {
  const ENGINES = {
    bing: { name: '必应', url: (q) => 'https://www.bing.com/search?q=' + encodeURIComponent(q) },
    baidu: { name: '百度', url: (q) => 'https://www.baidu.com/s?wd=' + encodeURIComponent(q) },
    google: { name: 'Google', url: (q) => 'https://www.google.com/search?q=' + encodeURIComponent(q) }
  };
  let engine = 'bing';
  let q = ztools.query || '';

  function render() {
    const qEl = document.getElementById('q');
    if (q) { qEl.textContent = q; qEl.className = 'q'; }
    else { qEl.textContent = '输入搜索内容'; qEl.className = 'q empty'; }
    document.getElementById('url').textContent = q ? ENGINES[engine].url(q) : '';
    const wrap = document.getElementById('engines');
    wrap.innerHTML = '';
    Object.keys(ENGINES).forEach((k) => {
      const b = document.createElement('button');
      b.className = 'eng' + (k === engine ? ' on' : '');
      b.textContent = ENGINES[k].name;
      b.addEventListener('click', async () => {
        engine = k;
        await ztools.api.dbSet('engine', k);
        render();
      });
      wrap.appendChild(b);
    });
  }

  async function open() {
    if (!q) return;
    await ztools.api.openExternal(ENGINES[engine].url(q));
    await ztools.api.hideMainWindow();
  }

  ztools.onSubInput((v) => { q = v; render(); });
  ztools.onSubEnter(open);
  document.getElementById('go').addEventListener('click', open);

  (async () => {
    const settings = await ztools.api.settingsGet();
    engine = settings.engine || 'bing';
    const saved = await ztools.api.dbGet('engine');
    if (saved && ENGINES[saved]) engine = saved;
    await ztools.api.setSubInput('输入搜索内容,回车打开浏览器');
    render();
  })();
})();
</script>
</body>
</html>
